target-version = "py312"
line-length = 100
extend-exclude = ["migrations", ".venv", "data", "media", "staticfiles"]

[lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # import sorting
  "B",   # bugbear
  "UP",  # modern Python syntax
  "DJ",  # Django
  "C4",  # comprehensions
  "SIM", # simplifications
  "PT",  # pytest style
  "RUF", # ruff-specific
]
ignore = [
  "RUF012", # Django Meta, admin and serializer class attributes are intentionally mutable
]

[lint.isort]
known-first-party = ["apps", "config"]

[format]
quote-style = "double"
