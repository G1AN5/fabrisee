name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install Python packages
        run: python -m pip install -r requirements-dev.txt
      - name: Lint and format check (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Tests with coverage (pytest)
        run: python -m pytest --cov=apps --cov-report=term-missing:skip-covered

  frontend:
    name: Frontend (lint, typecheck, Vitest, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Node packages
        run: npm ci --no-audit --no-fund
      - name: Lint (ESLint, Prettier)
        run: npm run lint
      - name: TypeScript check
        run: npm run typecheck
      - name: Unit tests (Vitest)
        run: npm test
      - name: Production build
        run: npm run build

  e2e:
    name: End to end (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies, migrate, and load the demo data
        run: make setup
      - name: Install the Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run the specs and capture screenshots (starts both servers)
        working-directory: frontend
        run: npx playwright test
      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload the screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: screenshots
          path: docs/screenshots/
          if-no-files-found: ignore
          retention-days: 14
